name: Refresh profile

# Rebuilds the README artwork from live GitHub data so the streak, the
# contribution calendar and the repo counts stay true without anyone editing SVG.
on:
  schedule:
    - cron: "17 19 * * *"   # daily, 06:17 Sydney time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "fonts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install --quiet fonttools brotli

      - name: Pull live stats
        # PROFILE_TOKEN is a classic PAT with `repo` + `read:user`. Without it the
        # job still runs, but only sees public repositories and public contributions.
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python build/fetch_stats.py

      - name: Render SVGs and README
        run: |
          python build/build.py
          python build/readme.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md stats.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile artwork [skip ci]"
            git push
          fi
